<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória Super Kids</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Quicksand', sans-serif; }
        .titulo { font-family: 'Fredoka One', cursive; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-100 to-purple-100 p-4 flex flex-col items-center select-none">

    <h1 class="titulo text-3xl md:text-4xl font-black text-purple-600 mb-6 text-center drop-shadow-sm mt-4">🧠 Jogo da Memória Super Kids</h1>

    <div id="tela-inicial" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border-4 border-purple-300">
        <h2 class="text-xl font-bold text-gray-700 mb-4">1. Quem vai jogar?</h2>
        <div class="flex gap-2 mb-4">
            <input type="text" id="input-nome" placeholder="Nome do jogador" class="flex-1 px-4 py-2 border-2 rounded-xl text-black border-gray-300 focus:outline-none focus:border-purple-500">
            <button onclick="adicionarJogador()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-4 py-2 rounded-xl transition-all">Adicionar</button>
        </div>
        <div class="mb-6">
            <p class="text-sm font-semibold text-gray-500 mb-2">Jogadores na fila:</p>
            <ul id="lista-jogadores" class="space-y-1"></ul>
            <p id="lista-vazia" class="text-gray-400 italic text-sm">Nenhum jogador adicionado ainda...</p>
        </div>
        <h2 class="text-xl font-bold text-gray-700 mb-2">2. Tempo de Espiar (segundos)</h2>
        <input type="number" id="tempo-espiar" min="3" max="30" value="10" class="w-full text-black px-4 py-2 border-2 border-gray-300 rounded-xl mb-6 focus:outline-none focus:border-purple-500">
        <button onclick="iniciarJogo()" class="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-black py-4 rounded-2xl shadow-lg transform hover:scale-105 transition-all uppercase tracking-wider">🚀 Iniciar Jogo!</button>
    </div>
    <div id="tela-jogo" class="w-full max-w-md hidden">
        <div class="bg-white p-4 rounded-2xl shadow-md w-full mb-4 flex justify-between items-center border-2 border-blue-300">
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase">Jogador Atual</p>
                <p id="jogador-atual" class="text-2xl font-black text-blue-600">-</p>
            </div>
            <div class="text-right">
                <p class="text-xs font-bold text-gray-400 uppercase">Próximo</p>
                <p id="proximo-jogador" class="text-sm font-bold text-gray-600">-</p>
            </div>
        </div>
        <div id="banner-mensagem" class="bg-yellow-400 text-yellow-900 font-extrabold text-lg px-6 py-2 rounded-full mb-6 shadow-sm text-center w-full">Memorize as cartas!</div>
        <div id="tabuleiro" class="grid grid-cols-4 gap-3 w-full aspect-square mb-6"></div>
        <div class="w-full bg-white p-4 rounded-xl shadow">
            <p class="font-bold text-gray-700 mb-2 border-b pb-1 text-sm">Placar da Rodada:</p>
            <div id="placar" class="grid grid-cols-2 gap-2"></div>
        </div>
    </div>

    <div id="tela-vencedor" class="mt-4 bg-yellow-100 border-4 border-yellow-400 p-6 rounded-2xl shadow-xl max-w-md text-center hidden">
        <p class="text-5xl mb-2">👑</p>
        <h2 class="text-2xl font-black text-yellow-700 mb-2">Temos um Campeão!</h2>
        <p id="texto-vencedor" class="text-xl text-gray-700 font-bold mb-4"></p>
        <button onclick="reiniciarTudo()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-black px-6 py-3 rounded-xl shadow transition-all uppercase">Jogar Novamente 🔄</button>
    </div>
    <script>
        const IMAGENS = ['⚽', '🚗', '🐱', '🪆', '🛋️', '🚀', '🎨', '🍕'];
        let jogadores = [];
        let indexAtual = 0;
        let cartas = [];
        let viradas = [];
        let bloqueado = false;
        let tempoTimer;

        function adicionarJogador() {
            const input = document.getElementById('input-nome');
            const nome = input.value.trim();
            if(!nome) return;
            jogadores.push({ nome, pontos: 0 });
            input.value = '';
            atualizarListaEspera();
        }

        function atualizarListaEspera() {
            const lista = document.getElementById('lista-jogadores');
            const vazia = document.getElementById('lista-vazia');
            lista.innerHTML = '';
            if(jogadores.length > 0) vazia.classList.add('hidden');
            jogadores.forEach((j, i) => {
                lista.innerHTML += `<li class="bg-purple-50 text-purple-700 font-bold px-3 py-1.5 rounded-lg text-sm flex justify-between"><span>${i+1}. ${j.nome}</span></li>`;
            });
        }

        function iniciarJogo() {
            if(jogadores.length === 0) return alert('Adicione pelo menos 1 jogador!');
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-vencedor').classList.add('hidden');
            document.getElementById('tela-jogo').classList.remove('hidden');
            indexAtual = 0;
            jogadores.forEach(j => j.pontos = 0);
            let duplicadas = [...IMAGENS, ...IMAGENS];
            cartas = duplicadas.map((img, idx) => ({ id: idx, img, par: false, aberta: false })).sort(() => Math.random() - 0.5);
            montarTabuleiro(true);
            atualizarPlacar();
            let tempo = parseInt(document.getElementById('tempo-espiar').value) || 10;
            const banner = document.getElementById('banner-mensagem');
            bloqueado = true;
            banner.innerHTML = `⏱️ Guarde na memória! Sumindo em: ${tempo}s`;
            clearInterval(tempoTimer);
            tempoTimer = setInterval(() => {
                tempo--;
                if(tempo <= 0) {
                    clearInterval(tempoTimer);
                    bloqueado = false;
                    montarTabuleiro(false);
                    banner.innerHTML = `Vez de: ${jogadores[indexAtual].nome}`;
                } else {
                    banner.innerHTML = `⏱️ Guarde na memória! Sumindo em: ${tempo}s`;
                }
            }, 1000);
        }

        function montarTabuleiro(revelado) {
            const tab = document.getElementById('tabuleiro');
            tab.innerHTML = '';
            cartas.forEach(c => {
                let conteudo = revelado || c.par || c.aberta ? c.img : '❓';
                let classes = c.par ? 'bg-transparent border-transparent opacity-0 pointer-events-none' : (revelado || c.aberta ? 'bg-white border-blue-400' : 'bg-gradient-to-tr from-purple-500 to-indigo-600 border-white text-white');
                tab.innerHTML += `<button onclick="clicarCarta(${c.id})" class="aspect-square text-4xl rounded-2xl shadow-md font-bold border-4 transition-all ${classes}">${conteudo}</button>`;
            });
        }

        function atualizarPlacar() {
            document.getElementById('jogador-atual').innerText = jogadores[indexAtual].nome;
            document.getElementById('proximo-jogador').innerText = jogadores[(indexAtual + 1) % jogadores.length].nome;
            const placar = document.getElementById('placar');
            placar.innerHTML = '';
            jogadores.forEach((j, i) => {
                let destaque = i === indexAtual ? 'bg-blue-100 text-blue-800 border border-blue-300' : 'bg-gray-100 text-gray-600';
                placar.innerHTML += `<div class="p-2 rounded-lg text-xs font-bold flex justify-between ${destaque}"><span>${j.nome}</span><span>${j.pontos} pts</span></div>`;
            });
        }

        function clicarCarta(id) {
            if(bloqueado) return;
            let carta = cartas.find(c => c.id === id);
            if(carta.par || carta.aberta || viradas.length >= 2) return;
            carta.aberta = true;
            viradas.push(carta);
            montarTabuleiro(false);
            if(viradas.length === 2) {
                bloqueado = true;
                const banner = document.getElementById('banner-mensagem');
                if(viradas[0].img === viradas[1].img) {
                    setTimeout(() => {
                        viradas[0].par = true;
                        viradas[1].par = true;
                        jogadores[indexAtual].pontos += 5;
                        viradas = [];
                        bloqueado = false;
                        if(cartas.every(c => c.par)) {
                            finalizarJogo();
                        } else {
                            banner.innerHTML = `✅ Muito bem, ${jogadores[indexAtual].nome}! Continue.`;
                            montarTabuleiro(false);
                            atualizarPlacar();
                        }
                    }, 800);
                } else {
                    setTimeout(() => {
                        viradas[0].aberta = false;
                        viradas[1].aberta = false;
                        viradas = [];
                        indexAtual = (indexAtual + 1) % jogadores.length;
                        bloqueado = false;
                        banner.innerHTML = `❌ Errou! Vez de: ${jogadores[indexAtual].nome}`;
                        montarTabuleiro(false);
                        atualizarPlacar();
                    }, 1500);
                }
            }
        }

        function finalizarJogo() {
            document.getElementById('tela-jogo').classList.add('hidden');
            document.getElementById('tela-vencedor').classList.remove('hidden');
            let ordenado = [...jogadores].sort((a,b) => b.pontos - a.pontos);
            document.getElementById('texto-vencedor').innerHTML = `<span class="text-purple-600">${ordenado[0].nome}</span> ganhou com <span class="text-green-600">${ordenado[0].pontos} pontos</span>!`;
        }

        function reiniciarTudo() {
            document.getElementById('tela-vencedor').classList.add('hidden');
            document.getElementById('tela-inicial').classList.remove('hidden');
            jogadores = [];
            atualizarListaEspera();
        }
    </script>
</body>
</html>
